[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "esdoc-errata-ws"
version = "1.0.0"
description = "ES-DOC Errata Web Service"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "arrow>=1.2.0",
    "beautifulsoup4>=4.12.0",
    "b2handle>=1.0.0",
    "jsonschema>=4.0.0",
    "oauthlib>=3.2.0",
    "psycopg2-binary>=2.9.6",
    "requests>=2.28.0",
    "requests-oauthlib>=1.3.0",
    "schedule>=1.1.0",
    "SQLAlchemy>=2.0.0",
    "SQLAlchemy-Utils>=0.40.0",
    "tornado>=6.2.0",
    "PyGithub>=1.55.0",
    "pytest>=7.0.0",
    "esgfpid>=1.0.0",
]

[tool.setuptools]
packages = ["esdoc_errata_ws"]