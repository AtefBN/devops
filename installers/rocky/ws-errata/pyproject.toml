[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "errata-ws"
version = "1.0.0"
description = "ES-DOC Errata Web Service"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "annotated-doc>=0.0.1",
    "arrow>=1.2.0",
    "attrs>=21.2.0",
    "beautifulsoup4>=4.12.0",
    "b2handle>=1.0.0",
    "certifi>=2017.4.17",
    "charset-normalizer>=2.0.0",
    "click>=8.0.0",
    "idna>=2.5",
    "jsonschema>=4.0.0",
    "jsonschema-specifications>=2023.0.0",
    "oauthlib>=3.2.0",
    "pydantic>=2.9.2",
    "pydantic-core",
    "python-dateutil>=2.8.0",
    "psycopg2-binary>=2.9.6",
    "referencing>=0.28.4",
    "requests>=2.28.0",
    "requests-oauthlib>=1.3.0",
    "rich>=13.0.0",
    "rpds-py>=0.7.0",
    "schedule>=1.1.0",
    "shellingham>=1.5.0",
    "six>=1.16.0",
    "SQLAlchemy>=2.0.0",
    "SQLAlchemy-Utils>=0.40.0",
    "tornado>=6.2.0",
    "typer>=0.9.0",
    "typing_extensions>=4.4.0",
    "PyGithub>=1.55.0",
    "pytest>=7.0.0",
    "esgfpid",
    "urllib3>=2.0.0",
    "esgvoc"
]
[tool.setuptools]
packages = ["esdoc_errata_ws"]